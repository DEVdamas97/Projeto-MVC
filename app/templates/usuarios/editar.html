<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário — Estoque</title>
</head>
<body>
    <h1>Editar Usuário</h1>

    <form action="/usuarios/{{ usuario_editar.id }}/editar" method="POST">
        <label>Nome:</label><br>
        <input type="text" name="nome" value="{{ usuario_editar.nome }}" required><br><br>

        <label>E-mail:</label><br>
        <input type="email" name="email" value="{{ usuario_editar.email }}" required><br><br>

        <label>Nova Senha (deixe em branco para manter a atual):</label><br>
        <input type="password" name="senha"><br><br>

        <label>Perfil:</label><br>
        <select name="role">
            <option value="user" {% if usuario_editar.role == 'user' %}selected{% endif %}>Usuário Comum</option>
            <option value="admin" {% if usuario_editar.role == 'admin' %}selected{% endif %}>Administrador</option>
        </select><br><br>

        <button type="submit">Atualizar</button>
        <a href="/usuarios">Cancelar</a>
    </form>
</body>
</html>
